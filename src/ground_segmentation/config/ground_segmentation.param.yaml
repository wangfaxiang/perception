/**:
  ros__parameters:
    use_single_frame_filter: False
    use_time_series_filter: True

    common_crop_box_filter:
      parameters:
        min_x: -50.0
        max_x: 100.0
        min_y: -50.0
        max_y: 50.0
        max_z: 2.5  # recommended 2.5 for non elevation_grid_mode
        min_z: -2.5 # recommended 0.0 for non elevation_grid_mode
        negative: False

    common_ground_filter:
      plugin: "ground_segmentation::ScanGroundFilterComponent"
      parameters:
        global_slope_max_angle_deg: 10.0
        local_slope_max_angle_deg: 13.0 # recommended 30.0 for non elevation_grid_mode
        split_points_distance_tolerance: 0.2
        use_virtual_ground_point: True
        split_height_distance: 0.2
        non_ground_height_threshold: 0.20
        grid_size_m: 0.1
        grid_mode_switch_radius: 20.0
        gnd_grid_buffer_size: 4
        detection_range_z_max: 2.5
        elevation_grid_mode: true

# ============ RANSAC 地面滤波节点 (ransac_ground_filter_node) ============
# 前/后两颗雷达各启动一个节点实例，通过 lidar_name 区分。
# lidar_name 用于推导默认话题名与 frame_id:
#   front → /front/rslidar_points_leveled → /front/no_ground_filter + /front/all_filter
#   rear  → /rear/rslidar_points_leveled  → /rear/no_ground_filter + /rear/all_filter

# ============ 前雷达 (front) ============
ransac_ground_filter_front:
  ros__parameters:
    lidar_name: "front"
    input_topic: "/front/rslidar_points_leveled"
    no_ground_filter_topic: "/front/no_ground_filter"   # 去扬尘后的非地面点云（聚类用）
    no_ground_raw_topic: "/front/no_ground_raw"         # 扬尘过滤前的非地面点云（调试观察用）
    all_filter_topic: "/front/all_filter"               # 地面 + 过滤后非地面（边坡/悬崖检测用）
    base_frame: "front_rslidar"
    debug: false
    max_iterations: 1000
    min_trial: 5000
    min_points: 1000
    outlier_threshold: 0.01
    plane_slope_threshold: 10.0
    # voxel_size_x: 0.04
    # voxel_size_y: 0.04
    # voxel_size_z: 0.04
    voxel_size_x: 0.10
    voxel_size_y: 0.10
    voxel_size_z: 0.10
    # 距离自适应体素：边长 = voxel_size + adaptive_voxel_ratio * 水平距离，上限 adaptive_voxel_max_size
    use_downsample: false          # false: 不降采样，RANSAC 用全分辨率点云拟合
    use_adaptive_voxel: true
    adaptive_voxel_ratio: 0.015
    adaptive_voxel_max_size: 0.4
    height_threshold: 0.1
    max_range: 10.0

    # ---- 扬尘过滤（单帧网格密度法）----
    enable_dust_filter: true
    dust_filter_horiz_angle_resolution: 1.0   # 水平角分辨率（°）
    dust_filter_vert_angle_resolution: 1.0    # 垂直角分辨率（°）
    dust_filter_range_resolution: 0.1         # 近处基准距离分辨率（m）
    dust_filter_range_growth: 0.02            # bin 宽随距离线性增长率（每米增加 0.02m）
    dust_filter_min_density: 20                # 网格内点数 < 该阈值 → 判为扬尘剔除

    # ---- 扬尘网格可视化（调试）----
    debug_dust_grid: true                     # 是否在 RViz 画扬尘网格线
    debug_dust_grid_topic: "/front/dust_grid" # 网格线话题
    debug_dust_grid_stride: 1                # 每 N 条角度线画一条
    debug_dust_grid_range_min: 0.5
    debug_dust_grid_range_max: 10.0
    debug_dust_grid_azimuth_min: -60.0
    debug_dust_grid_azimuth_max: 60.0
    debug_dust_grid_elevation_min: -45.0
    debug_dust_grid_elevation_max: 0.0

# ============ 后雷达 (rear) ============
ransac_ground_filter_rear:
  ros__parameters:
    lidar_name: "rear"
