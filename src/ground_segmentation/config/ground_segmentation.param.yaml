    all_filter_topic: "/rear/all_filter"               # 地面 + 过滤后非地面（边坡/悬崖检测用）
    base_frame: "rear_rslidar"
    debug: false
    max_iterations: 1000
    min_trial: 5000
    min_points: 1000
    outlier_threshold: 0.01
    plane_slope_threshold: 10.0
    # voxel_size_x: 0.04
    # voxel_size_y: 0.04
    # voxel_size_z: 0.04
    voxel_size_x: 0.10
    voxel_size_y: 0.10
    voxel_size_z: 0.10
    # 距离自适应体素：边长 = voxel_size + adaptive_voxel_ratio * 水平距离，上限 adaptive_voxel_max_size
    use_downsample: false          # false: 不降采样，RANSAC 用全分辨率点云拟合
    use_adaptive_voxel: true
    adaptive_voxel_ratio: 0.015
    adaptive_voxel_max_size: 0.4
    height_threshold: 0.10
    max_range: 10.0

    # ---- 扬尘过滤（单帧网格密度法）----
    enable_dust_filter: true
    dust_filter_horiz_angle_resolution: 1.0   # 水平角分辨率（°）
    dust_filter_vert_angle_resolution: 1.0    # 垂直角分辨率（°）
    dust_filter_range_resolution: 0.1         # 近处基准距离分辨率（m）
    dust_filter_range_growth: 0.02            # bin 宽随距离线性增长率（每米增加 0.02m）
    dust_filter_min_density: 20                # 网格内点数 < 该阈值 → 判为扬尘剔除

    # ---- 扬尘网格可视化（调试）----
    debug_dust_grid: true                     # 是否在 RViz 画扬尘网格线
    debug_dust_grid_topic: "/rear/dust_grid"  # 网格线话题
    debug_dust_grid_stride: 2                # 每 N 条角度线画一条
    debug_dust_grid_range_min: 0.5
    debug_dust_grid_range_max: 10.0
    debug_dust_grid_azimuth_min: -60.0
    debug_dust_grid_azimuth_max: 60.0
    debug_dust_grid_elevation_min: -45.0
    debug_dust_grid_elevation_max: 0.0

# ============ Ray 地面滤波节点 (ray_ground_filter_node) ============
ray_ground_filter:
  ros__parameters:
    general_max_slope: 7.0
    local_max_slope: 5.0
    initial_max_slope: 7.0
    min_height_threshold: 0.15
