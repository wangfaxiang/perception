/**:
  ros__parameters:
    use_single_frame_filter: False
    use_time_series_filter: True

    common_crop_box_filter:
      parameters:
        min_x: -50.0
        max_x: 100.0
        min_y: -50.0
        max_y: 50.0
        max_z: 2.5  # recommended 2.5 for non elevation_grid_mode
        min_z: -2.5 # recommended 0.0 for non elevation_grid_mode
        negative: False

    common_ground_filter:
      plugin: "ground_segmentation::ScanGroundFilterComponent"
      parameters:
        global_slope_max_angle_deg: 10.0
        local_slope_max_angle_deg: 13.0 # recommended 30.0 for non elevation_grid_mode
        split_points_distance_tolerance: 0.2
        use_virtual_ground_point: True
        split_height_distance: 0.2
        non_ground_height_threshold: 0.20
        grid_size_m: 0.1
        grid_mode_switch_radius: 20.0
        gnd_grid_buffer_size: 4
        detection_range_z_max: 2.5
        elevation_grid_mode: true

# ============ RANSAC 地面滤波节点 (ransac_ground_filter_node) ============
# 前/后两颗雷达各启动一个节点实例，通过 lidar_name 区分。
# lidar_name 用于推导默认话题名与 frame_id:
#   front → /front/rslidar_points_leveled → /front/no_ground, base_frame=front_rslidar
#   rear  → /rear/rslidar_points_leveled  → /rear/no_ground,  base_frame=rear_rslidar

# ============ 前雷达 (front) ============
ransac_ground_filter_front:
  ros__parameters:
    lidar_name: "front"
    input_topic: "/front/rslidar_points_leveled"
    output_topic: "/front/no_ground"
    base_frame: "front_rslidar"
    debug: false
    max_iterations: 1000
    min_trial: 5000
    min_points: 1000
    outlier_threshold: 0.01
    plane_slope_threshold: 10.0
    # voxel_size_x: 0.04
    # voxel_size_y: 0.04
    # voxel_size_z: 0.04
    voxel_size_x: 0.20
    voxel_size_y: 0.20
    voxel_size_z: 0.20
    height_threshold: 0.15
    max_range: 8.0

# ============ 后雷达 (rear) ============
ransac_ground_filter_rear:
  ros__parameters:
    lidar_name: "rear"
    input_topic: "/rear/rslidar_points_leveled"
    output_topic: "/rear/no_ground"
    base_frame: "rear_rslidar"
    debug: false
    max_iterations: 1000
    min_trial: 5000
    min_points: 1000
    outlier_threshold: 0.01
    plane_slope_threshold: 10.0
    # voxel_size_x: 0.04
    # voxel_size_y: 0.04
    # voxel_size_z: 0.04
    voxel_size_x: 0.20
    voxel_size_y: 0.20
    voxel_size_z: 0.20
    height_threshold: 0.15
    max_range: 8.0

# ============ Ray 地面滤波节点 (ray_ground_filter_node) ============
ray_ground_filter:
  ros__parameters:
    general_max_slope: 7.0
    local_max_slope: 5.0
    initial_max_slope: 7.0
    min_height_threshold: 0.15
