/**:
  ros__parameters:
    # ---- I/O ----
    input_topic_front: "/front/rslidar_points"
    input_topic_rear: "/rear/rslidar_points"
    enable_rear: true
    # 前/后雷达点云都先变换到此坐标系，再拼接成一份点云做单次推理
    target_frame: "front_rslidar"
    output_topic: "/centerpoint_boxs_no_velocity"
    # 为空时使用 target_frame 作为输出 frame_id
    output_frame_id: ""
    # 前/后点云时间戳最大容差(ms)，超过则只用前雷达
    sync_tolerance_ms: 100

    # ---- model ----
    # 非空时，下面相对路径会拼接到该目录前（便于指向包 share/model 目录）
    # model_dir: ""
    # encoder_onnx_path: "model/encoder.onnx"
    # encoder_engine_path: "model/encoder.plan"
    # head_onnx_path: "model/head.onnx"
    # head_engine_path: "model/head.plan"

    model_dir: "/home/promote/autoware_data/lidar_centerpoint"
    encoder_onnx_path: "pts_voxel_encoder_centerpoint.onnx"
    encoder_engine_path: "pts_voxel_encoder_centerpoint.plan"
    head_onnx_path: "pts_backbone_neck_head_centerpoint.onnx"
    head_engine_path: "pts_backbone_neck_head_centerpoint.plan"

    trt_precision: "fp16"
    build_only: false

    # ---- network ----
    class_names: ["CAR", "TRUCK", "BUS", "BICYCLE", "PEDESTRIAN"]
    # 为空发布全部类别；否则只发布指定 id（id 对应 class_names 下标）
    target_class_ids: []
    score_threshold: 0.35
    point_feature_size: 4
    max_voxel_size: 40000
    point_cloud_range: [-76.8, -76.8, -4.0, 76.8, 76.8, 6.0]
    voxel_size: [0.32, 0.32, 10.0]
    downsample_factor: 1
    encoder_in_feature_size: 9

    # ---- post-process ----
    circle_nms_dist_threshold: 0.5
    yaw_norm_thresholds: [0.3, 0.3, 0.3, 0.3, 0.0]

    # ---- densification ----
    densification_world_frame_id: "map"
    densification_num_past_frames: 0
