# 沟壑（负障碍物）检测参数 —— 速腾聚创 E1R 固态雷达（120°×90°，1200×144）
#

# ============ 全节点共享参数（同一文件被三个节点加载；/** 通配任意节点名） ============
# 边坡分档阈值的【唯一真源】：检测实例用它分档，融合节点用它换算 stop_command 的 confidence。
# 代码里不再保留默认值（未提供则该节点启动即失败），避免代码与参数文件分叉。
/**:
  ros__parameters:
    edge_danger_dist: 4.0      # 最近距离 < 该值 → DANGER（并联动 /perception/stop_command）
    edge_caution_dist: 10.0    # 最近距离 ≤ 该值 → CAUTION（仅告警，不联动急停）

# 原理: 相邻线束地面落点水平间距比检测沟壑（沟底被近沿遮挡、雷达扫不到）。
#   Δx_th = h·(cot β_far − cot β_near)，ratio = Δx_meas / Δx_th > 阈值 → 沟。
#
# 前/后两颗 E1R 雷达各启动一个节点实例，通过 lidar_name 区分。
# lidar_name 用于推导默认话题名与 frame_id:
#   front → /front/rslidar_points, /front/ditch_cloud, frame_id=front_rslidar
#   rear  → /rear/rslidar_points,  /rear/ditch_cloud,  frame_id=rear_rslidar
#
# 定向检测 + 告警融合（契约 §3.1/§6.2）:
#   检测实例订阅 gate 镜像 /control/cmd_gate/cmd_vel 自判运动方向并门控
#   （前进只测前、后退只测后、停车/原地旋转双向均测）→ 各发一路原始告警；
#   edge_warning_fusion 取等级更高的一路 → /perception/edge_warning（契约话题）。

# ============ 前雷达 (E1R, front) ============
pothole_detection_front:
  ros__parameters:
    lidar_name: "front"
    input_topic: "/front/rslidar_points_leveled"
    ditch_cloud_topic: "/front/ditch_cloud"
    ditch_line_topic: "/front/ditch_line"
    voxel_cloud_topic: "/front/voxel_cloud"
    frame_id: "front_rslidar"

    mount_height: 1.2          # 雷达安装高度（米）

    horiz_fov_deg: 120.0
    horiz_res_deg: 0.1         # 列分辨率，须与雷达原生水平分辨率一致（1200 列）

    min_vert_angle_deg: -45.0  # 参与检测的最小垂直角（最近处，向下）
    max_vert_angle_deg: -1.0   # 参与检测的最大垂直角（最远处，须 < 0）

    max_range: 30.0            # 参与检测的最大水平距离（米）
    min_range: 3.0             # 参与检测的最小水平距离（米）

    ditch_ratio_thresh: 9.0    # 间距比阈值（越大越严格，误报越少）
    ditch_min_width: 0.5       # 最小沟宽（米）
    min_gap_m: 0.02            # 最小理论线束间距（米），小于则跳过该相邻对

    cluster_dist: 1.5          # 沟沿点聚类距离（米）
    min_points_per_ditch: 5    # 每段沟最少点数（≈横向连续列数）

    cliff_cloud_topic: "/front/cliff_cloud"

    voxel_leaf_size: 0.05      # 体素降采样叶子尺寸（米），<=0 关闭
    cliff_enable: false         # 是否启用悬崖检测
    cliff_max_range: 7.0       # 悬崖边缘最大水平距离（米）
    cliff_min_points: 3        # 列内最少点数才判悬崖
    cliff_vert_margin_deg: 1.0 # 最远点距 max_vert_angle 的最小角裕量（度）

    # ---- 边坡告警（本实例的原始告警，由 edge_warning_fusion 合并后发布契约话题）----
    # 分档阈值 edge_danger_dist / edge_caution_dist 见文件顶部 /** 共享段（唯一真源）
    edge_warning_raw_topic: "/pothole_detection_front/edge_warning_raw"
    edge_heartbeat_hz: 10.0    # 心跳频率（契约 §4.3 必须 ≥5Hz，建议 10Hz）
    edge_timeout_s: 0.5        # 点云断流超过该时长 → 输出安全默认值（§3.3）

    # ---- 定向检测门控（契约 §3.1/§6.2）----
    # 四态：前进(linear.x≥+v)只测前、后退(≤−v)只测后、
    #       |v|<v 且 |angular.z|≥ω → 原地旋转 / 两轴均低 → 停车（两者前后均检测）
    # 不参与检测的一侧整帧跳过点云处理，但仍发布 999.0/SAFE 维持原始告警心跳
    motion_gate_enable: true
    motion_cmd_topic: "/control/cmd_gate/cmd_vel"
    motion_v_thresh: 0.05      # 纵向速度阈值（m/s）：|v| < 该值视为无前进/后退意图
    motion_w_thresh: 0.05      # 角速度阈值（rad/s）：|v| 低于阈值且 |ω| ≥ 该值 → 原地旋转
    motion_timeout_s: 0.5      # 镜像断流超时（秒）→ 按停车处理（双向检测）

# ============ 后雷达 (E1R, rear) ============
pothole_detection_rear:
  ros__parameters:
    lidar_name: "rear"
    input_topic: "/rear/rslidar_points_leveled"
    ditch_cloud_topic: "/rear/ditch_cloud"
    ditch_line_topic: "/rear/ditch_line"
    voxel_cloud_topic: "/rear/voxel_cloud"
    frame_id: "rear_rslidar"

    mount_height: 1.2

    horiz_fov_deg: 120.0
    horiz_res_deg: 0.1

    min_vert_angle_deg: -45.0
    max_vert_angle_deg: -1.0

    max_range: 30.0
    min_range: 3.0

    ditch_ratio_thresh: 15.0
    ditch_min_width: 0.5
    min_gap_m: 0.02

    cluster_dist: 1.5
    min_points_per_ditch: 5

    cliff_cloud_topic: "/rear/cliff_cloud"

    voxel_leaf_size: 0.05      # 体素降采样叶子尺寸（米），<=0 关闭
    cliff_enable: false         # 是否启用悬崖检测
    cliff_max_range: 7.0       # 悬崖边缘最大水平距离（米）
    cliff_min_points: 3        # 列内最少点数才判悬崖
    cliff_vert_margin_deg: 1.0 # 最远点距 max_vert_angle 的最小角裕量（度）

    # ---- 边坡告警（本实例的原始告警，由 edge_warning_fusion 合并后发布契约话题）----
    # 分档阈值 edge_danger_dist / edge_caution_dist 见文件顶部 /** 共享段（唯一真源）
    edge_warning_raw_topic: "/pothole_detection_rear/edge_warning_raw"
    edge_heartbeat_hz: 10.0    # 心跳频率（契约 §4.3 必须 ≥5Hz，建议 10Hz）
    edge_timeout_s: 0.5        # 点云断流超过该时长 → 输出安全默认值（§3.3）

    # ---- 定向检测门控（契约 §3.1/§6.2），与 front 段同义 ----
    motion_gate_enable: true
    motion_cmd_topic: "/control/cmd_gate/cmd_vel"
    motion_v_thresh: 0.05
    motion_w_thresh: 0.05
    motion_timeout_s: 0.5

# ============ 边坡告警融合（/perception/edge_warning 唯一发布者） ============
# 订阅前后两路原始告警，周期性发布等级更高的一路（同级取距离更近）。
# 契约 §4.1/§4.2/§4.3：话题名/类型冻结、默认 QoS、≥5Hz 心跳（含无风险安全态）。
# 同时承担急停联动（契约 §5.2/§7）：融合等级达 DANGER → 同周期发布 /perception/stop_command。
edge_warning_fusion:
  ros__parameters:
    edge_warning_topic: "/perception/edge_warning"
    front_source_topic: "/pothole_detection_front/edge_warning_raw"
    rear_source_topic: "/pothole_detection_rear/edge_warning_raw"
    frame_id: "base_link"      # 车体系（距离为标量，无需坐标变换）
    edge_heartbeat_hz: 10.0    # 融合/发布频率（契约 §4.3 必须 ≥5Hz，建议 10Hz）
    source_timeout_s: 0.5      # 单侧原始告警断流超时（秒）→ 该侧按 999.0/SAFE 参与融合

    # ---- 急停联动（契约 §3.3/§5.1/§5.2/§7）----
    # 融合等级 == LEVEL_DANGER 且连续 stop_debounce_frames 个周期成立 → stop=true,
    # reason=REASON_EDGE_DANGER；等级回退后下一周期即发 stop=false（立即恢复，不消抖）。
    # 锁存与解锁在系统侧 autodth_cmd_gate，本节点只维护 stop 电平（风险期间持续发布）。
    # reason 目前只有边坡一类；后续障碍物急停（PERSON/VEHICLE/OTHER）应在此节点聚合，
    # 按 §3.1 类别优先顺序取最高优先级来源。
    # confidence 换算用的 DANGER 阈值取文件顶部 /** 共享段（与检测实例同源）
    stop_command_topic: "/perception/stop_command"
    stop_on_danger: true       # false = 只告警不联动急停（首轮联调/纯显示场景）
    stop_debounce_frames: 2    # 连续 N 帧原始告警 DANGER 才置 stop（1 = 不消抖，收到即触发）

    # 运动方向镜像：仅用于日志标注（前进/后退/原地旋转/停车/无信号），
    # 门控在检测实例内完成，融合本身与方向解耦；阈值须与检测实例保持一致
    motion_cmd_topic: "/control/cmd_gate/cmd_vel"
    motion_v_thresh: 0.05
    motion_w_thresh: 0.05
    motion_timeout_s: 0.5
