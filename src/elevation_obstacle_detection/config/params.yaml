# 局部栅格高程差法地面障碍物检测参数（矿山 / 起伏地面适配）
#
# 订阅 pointcloud_preprocess 的 leveled_filtered_smoothed 点云（全量扬尘过滤 + 降采样 + 高度平滑），
# 在 xy 平面建栅格，取每格最低点建 DEM，再做邻域最小值低通得到局部参考地面；
# 点相对局部地面高度差 > height_threshold 即判为障碍物，聚类成包围盒发布到 rviz。
#
# 关键参数说明：
#   grid_size_m        栅格边长（m），越大越抗噪、越小越精细；矿山建议 0.3~0.5
#   ground_window      DEM 低通邻域半径（格数），1 = 3x3 邻域取最小值；
#                      地面起伏越剧烈可适当加大，让局部地面更平滑
#   height_threshold   相对局部地面高度差阈值（m），超过即判障碍物，矿山建议 0.2~0.3
#   cluster_tolerance  欧氏聚类距离容差（m）
#   min_cluster_size   少于该点数的簇丢弃（滤除孤立噪点）

# ============ 前雷达 (front) ============
elevation_obstacle_detection_front:
  ros__parameters:
    lidar_name: "front"
    input_topic: "/front/leveled_filtered_smoothed"
    # input_topic: "/front/smoothed_upper_and_ground"
    frame_id: "front_rslidar"

    obstacle_cloud_topic: "/front/elevation_obstacle/cloud"
    boxs_topic: "/front/elevation_obstacle/boxs"
    marker_topic: "/front/elevation_obstacle/marker"
    ground_grid_topic: "/front/elevation_obstacle/ground_grid"

    max_range: 8.0          # 只取水平距离 20m 内的点
    min_range: 0.3           # 最小水平距离(m)，近处车身/盲区点丢弃
    grid_size_m: 0.3         # 栅格边长(m)
    ground_window: 1         # DEM 低通邻域半径(格数)，1=3x3
    height_threshold: 0.30   # 相对局部地面高度差阈值(m)
    cluster_tolerance: 0.5   # 欧氏聚类距离容差(m)
    min_cluster_size: 50     # 每簇最少点数
    max_cluster_size: 100000 # 每簇最多点数
    publish_ground_grid: true  # 是否发布局部参考地面栅格点云（调试用）

    # ---- 障碍物告警（与 cluster 一致：本实例只发「单雷达原始告警」，由 warning_fusion 融合）----
    obstacle_warning_raw_topic: "/elevation_obstacle_detection_front/obstacle_warning_raw"
    obstacle_type: 3            # 3=其他；本节点只做几何检测，无类别识别（可强制 1=人员 / 2=车辆）
    obstacle_heartbeat_hz: 10.0 # 心跳频率（必须 ≥5Hz）
    obstacle_timeout_s: 0.5     # 点云断流超过该时长 → 输出安全默认值
    # 上报/急停阈值 obstacle_warn_dist / obstacle_danger_dist 的唯一真源在
    # perception_common/config/params.yaml 的 /** 共享段（launch 会同时加载）

    # ---- 定向检测门控（与 cluster/边坡检测共用 perception_common/motion_state.hpp）----
    motion_gate_enable: true
    motion_cmd_topic: "/control/cmd_gate/cmd_vel"
    motion_v_thresh: 0.05      # 纵向速度阈值（m/s）
    motion_w_thresh: 0.05      # 角速度阈值（rad/s）
    motion_timeout_s: 0.5      # 镜像断流超时（秒）→ 按停车处理

# ============ 后雷达 (rear) ============
elevation_obstacle_detection_rear:
  ros__parameters:
    lidar_name: "rear"
    input_topic: "/rear/leveled_filtered_smoothed"
    frame_id: "rear_rslidar"

    obstacle_cloud_topic: "/rear/elevation_obstacle/cloud"
    boxs_topic: "/rear/elevation_obstacle/boxs"
    marker_topic: "/rear/elevation_obstacle/marker"
    ground_grid_topic: "/rear/elevation_obstacle/ground_grid"

    max_range: 20.0
    min_range: 0.3
    grid_size_m: 0.3
    ground_window: 1
    height_threshold: 0.25
    cluster_tolerance: 0.5
    min_cluster_size: 10
    max_cluster_size: 100000
    publish_ground_grid: true

    # ---- 障碍物告警（同 front 段语义）----
    obstacle_warning_raw_topic: "/elevation_obstacle_detection_rear/obstacle_warning_raw"
    obstacle_type: 3
    obstacle_heartbeat_hz: 10.0
    obstacle_timeout_s: 0.5

    # ---- 定向检测门控（同 front 段语义）----
    motion_gate_enable: true
    motion_cmd_topic: "/control/cmd_gate/cmd_vel"
    motion_v_thresh: 0.05
    motion_w_thresh: 0.05
    motion_timeout_s: 0.5
