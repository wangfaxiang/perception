# 统一沟壑 + 悬崖边缘检测参数
#
# 将 all_filter 点云（地面 + 过滤后非地面）按 (水平角, 俯仰角) 投影成 1° 网格图像(默认 120x45)，
# 在"距离连续"一维上找断点，输出 /<lidar>/ditch_cloud + /<lidar>/ditch_line。
# 同时订阅 cluster 的全量框，剔除落在框水平横截面（xy 投影）内的边缘点，
# 避免地面障碍物/推进梁形成的假边缘。
#
# 与 pothole_detection 一致：本节点同时发布单雷达原始边坡告警
# ~/edge_warning_raw，由 perception_common 的 warning_fusion 合并为契约话题；
# 分档阈值 edge_danger_dist / edge_caution_dist 在 perception_common/config/params.yaml
# 的 /** 共享段（唯一真源，launch 同时加载两个文件）。

# ============ 前雷达 (front) ============
range_image_segmentation_front:
  ros__parameters:
    lidar_name: "front"
    input_topic: "/front/all_filter"
    edge_cloud_topic: "/front/ditch_cloud"
    edge_line_topic: "/front/ditch_line"
    frame_id: "front_rslidar"

    # ---- 边坡告警（本实例的原始告警，由 perception_common 的 warning_fusion 合并发布契约话题）----
    # 分档阈值 edge_danger_dist / edge_caution_dist 见 perception_common/config/params.yaml 的 /** 共享段（唯一真源）
    edge_warning_raw_topic: "/range_image_segmentation_front/edge_warning_raw"
    edge_heartbeat_hz: 10.0    # 心跳频率（契约 §4.3 必须 ≥5Hz，建议 10Hz）
    edge_timeout_s: 0.5        # 点云断流超过该时长 → 输出安全默认值（§3.3）

    # ---- 定向检测门控（契约 §3.1/§6.2）----
    motion_gate_enable: true
    motion_cmd_topic: "/control/cmd_gate/cmd_vel"
    motion_v_thresh: 0.05
    motion_w_thresh: 0.05
    motion_timeout_s: 0.5

    max_range: 12.0        # 只取 12m 内的点
    min_range: 0.2         # 最小距离(m)，小于该值的点丢弃
    gap_thresh: 1.5        # 相邻点距离差大于该值视为断点(m)，近处基准阈值
    gap_slope: 0.15        # 断点阈值随距离线性放大系数(1/m)：有效阈值 = gap_thresh + gap_slope*range
    edge_max_range: 10.0   # 边缘点输出距离上限(m)，大于该值的边缘点丢弃
    cliff_min_elev: -8.0  # 悬崖点最小垂直角(度)，垂直角大于该值的悬崖点视为远处误判过滤
    outlier_mean_k: 6      # 离群点判断的近邻数
    outlier_std_mul: 1.0   # 离群点剔除的 std 倍数

    # ---- 方位角聚类（线段可视化）：边缘点按方位角排序后聚类，每簇一条线、不同颜色 ----
    cluster_gap_range: 1.0   # 相邻两点 range 差大于该值视为不同簇(m)
    cluster_gap_dist: 1.0    # 相邻两点欧氏距离大于该值视为不同簇(m)
    cluster_min_points: 10   # 每簇最少点数，少于该值的簇过滤
    edge_smooth_enable: true   # 是否对每簇折线做平滑（每点与前后各 2 点取平均）

    # ---- 障碍物框过滤：订阅 cluster 的全量框，剔除框内由地面障碍物/推进梁形成的假边缘 ----
    box_topic: "/front/box/cluster/euclidean_all"   # 全量框话题（cluster 发布，不过滤）
    box_filter_enable: true     # 是否启用框内边缘点过滤
    box_filter_margin: 0.0      # 包围盒外扩边距(m)，0 表示不扩展

    horizontal_angle_min: -60.0   # 水平角下限(度)
    horizontal_angle_max: 60.0    # 水平角上限(度)
    horizontal_res: 0.1          # 水平分辨率(度/格)
    vertical_angle_min: -13.0     # 俯仰角下限(度，最下方)
    vertical_angle_max: 0.0       # 俯仰角上限(度，最上方/水平)
    vertical_res:  0.05          # 垂直分辨率(度/格)

# ============ 后雷达 (rear) ============
range_image_segmentation_rear:
  ros__parameters:
    lidar_name: "rear"
    input_topic: "/rear/all_filter"
    edge_cloud_topic: "/rear/ditch_cloud"
    edge_line_topic: "/rear/ditch_line"
    frame_id: "rear_rslidar"

    # ---- 边坡告警（本实例的原始告警，由 perception_common 的 warning_fusion 合并发布契约话题）----
    # 分档阈值 edge_danger_dist / edge_caution_dist 见 perception_common/config/params.yaml 的 /** 共享段（唯一真源）
    edge_warning_raw_topic: "/range_image_segmentation_rear/edge_warning_raw"
    edge_heartbeat_hz: 10.0    # 心跳频率（契约 §4.3 必须 ≥5Hz，建议 10Hz）
    edge_timeout_s: 0.5        # 点云断流超过该时长 → 输出安全默认值（§3.3）

    # ---- 定向检测门控（契约 §3.1/§6.2）----
    motion_gate_enable: true
    motion_cmd_topic: "/control/cmd_gate/cmd_vel"
    motion_v_thresh: 0.05
    motion_w_thresh: 0.05
    motion_timeout_s: 0.5

    max_range: 12.0
    min_range: 0.2
    gap_thresh: 1.0
    gap_slope: 0.15
    edge_max_range: 10.0
    cliff_min_elev: -8.0
    outlier_mean_k: 6
    outlier_std_mul: 1.0

    # ---- 方位角聚类（线段可视化）：边缘点按方位角排序后聚类，每簇一条线、不同颜色 ----
    cluster_gap_range: 1.0   # 相邻两点 range 差大于该值视为不同簇(m)
    cluster_gap_dist: 1.0    # 相邻两点欧氏距离大于该值视为不同簇(m)
    cluster_min_points: 10   # 每簇最少点数，少于该值的簇过滤
    edge_smooth_enable: true   # 是否对每簇折线做平滑（每点与前后各 2 点取平均）

    # ---- 障碍物框过滤：订阅 cluster 的全量框，剔除框内由地面障碍物/推进梁形成的假边缘 ----
    box_topic: "/rear/box/cluster/euclidean_all"   # 全量框话题（cluster 发布，不过滤）
    box_filter_enable: true     # 是否启用框内边缘点过滤
    box_filter_margin: 0.0      # 包围盒外扩边距(m)，0 表示不扩展

    horizontal_angle_min: -60.0
    horizontal_angle_max: 60.0
    horizontal_res: 1.0
    vertical_angle_min: -45.0
    vertical_angle_max: 0.0
    vertical_res: 1.0
